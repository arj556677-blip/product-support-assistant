<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechPro AI Product Support Assistant | Grounded RAG & Speech Platform</title>
  
  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg-dark: #0B0F19;
      --bg-card: rgba(17, 24, 39, 0.75);
      --bg-card-hover: rgba(31, 41, 55, 0.85);
      --bg-glass: rgba(255, 255, 255, 0.03);
      --border-color: rgba(255, 255, 255, 0.08);
      --border-accent: rgba(99, 102, 241, 0.35);
      
      --primary: #6366F1;
      --primary-hover: #4F46E5;
      --primary-glow: rgba(99, 102, 241, 0.3);
      
      --secondary: #06B6D4;
      --secondary-glow: rgba(6, 182, 212, 0.25);
      
      --success: #10B981;
      --warning: #F59E0B;
      --danger: #EF4444;
      
      --text-main: #F9FAFB;
      --text-muted: #9CA3AF;
      --text-dim: #6B7280;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(99, 102, 241, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(6, 182, 212, 0.06) 0%, transparent 40%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.5;
    }

    /* Navbar Styling */
    header.app-header {
      background: rgba(11, 15, 25, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .nav-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--text-main);
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: white;
      box-shadow: 0 0 15px var(--primary-glow);
    }

    .brand-text h1 {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.3px;
      background: linear-gradient(135deg, #FFF, #94A3B8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-text p {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 500;
    }

    nav.nav-links {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    nav.nav-links a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 10px;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    nav.nav-links a:hover {
      color: #FFF;
      background: rgba(255, 255, 255, 0.05);
    }

    nav.nav-links a.active {
      border: 1px solid var(--border-accent);
      color: #FFF;
      background: rgba(99, 102, 241, 0.15);
      box-shadow: 0 0 12px var(--primary-glow);
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.25);
      border-radius: 20px;
      font-size: 12px;
      color: #34D399;
      font-weight: 600;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      background-color: var(--success);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--success);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.2); }
      100% { opacity: 1; transform: scale(1); }
    }

    main.app-body {
      flex: 1;
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
      padding: 24px;
    }

    footer.app-footer {
      border-top: 1px solid var(--border-color);
      padding: 16px 24px;
      text-align: center;
      font-size: 12px;
      color: var(--text-dim);
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-dark);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.3);
    }
  </style>
</head>
<body>

  <header class="app-header">
    <div class="nav-container">
      <a href="/" class="brand-logo">
        <div class="brand-icon">
          <i class="fa-solid fa-headset"></i>
        </div>
        <div class="brand-text">
          <h1>TechPro AI Assistant</h1>
          <p>Microsoft Foundry • Grounded RAG • Speech AI</p>
        </div>
      </a>

      <nav class="nav-links">
        <a href="/" class="{% if request.path == '/' or request.path == '/chat' %}active{% endif %}">
          <i class="fa-solid fa-robot"></i> AI Assistant
        </a>
        <a href="/vision" class="{% if request.path == '/vision' %}active{% endif %}">
          <i class="fa-solid fa-eye"></i> Vision
        </a>
        <a href="/text-analysis" class="{% if request.path == '/text-analysis' %}active{% endif %}">
          <i class="fa-solid fa-file-lines"></i> Text Analytics
        </a>
        <a href="/content-understanding" class="{% if request.path == '/content-understanding' %}active{% endif %}">
          <i class="fa-solid fa-layer-group"></i> Content Analyzer
        </a>
      </nav>

      <div class="status-badge">
        <span class="status-dot"></span> AI & Voice Active
      </div>
    </div>
  </header>

  <main class="app-body">
    {% block content %}{% endblock %}
  </main>

  <footer class="app-footer">
    TechPro AI Product Support Assistant &copy; 2026 | Powered by Microsoft Foundry, RAG Architecture, Speech-to-Text & SQLite
  </footer>

</body>
</html>
